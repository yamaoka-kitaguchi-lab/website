on:
  push:
    branches: [master]

jobs:
  build:
    name: Build website
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image with latest theme
        run: docker compose build --build-arg CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }} remote

      - name: Build Hugo website
        run: docker compose run --no-build remote hugo

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
